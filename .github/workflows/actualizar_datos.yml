name: Actualizar datos FBref los lunes

on:
  schedule:
    # Todos los lunes a las 12:00 UTC (6:00 AM CST / hora de Honduras)
    - cron: "0 12 * * 1"
  workflow_dispatch:

jobs:
  actualizar-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar actualización hacia Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u actualizar_datos.py