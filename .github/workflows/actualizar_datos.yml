name: Actualizar datos FBref los lunes

on:
  schedule:
    # Todos los lunes a las 12:00 UTC (6:00 AM CST / hora de Honduras)
    - cron: "0 12 * * 1"
  workflow_dispatch:

jobs:
  actualizar-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar Google Chrome y pantalla virtual (xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb wget gnupg
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          rm google-chrome-stable_current_amd64.deb

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cachear dependencias de botasaurus
        uses: actions/cache@v4
        with:
          path: ~/.local/share/botasaurus
          key: botasaurus-libs-v1

      - name: Ejecutar actualización hacia Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: xvfb-run -a python -u actualizar_datos.py